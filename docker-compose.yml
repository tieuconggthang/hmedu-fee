version: '3.8'

services:
  fee-collection:
    build: .
    container_name: hmedu-fee-service
    ports:
      - "8082:8080"                 # API port (host:8082 → container:8080)
    volumes:
      - ./data:/app/data          # File Excel học phí
      - ./logs:/app/logs          # Logs
      - fee-db:/app/data/db       # H2 database
    environment:
      - FEE_EXCEL_PATH=/app/data/fee.xlsx
      - ZALO_API_URL=http://172.21.0.2:10000
      - DEFAULT_BANK_ID=970407
      - API_SECRET_KEY=${API_SECRET_KEY}
      # - FEE_CRON=0 0 8 1 * ?      # 8h sáng ngày 1 hàng tháng
      - FEE_CRON=0/10 * * * * ?      # Chạy mỗi 10 giây (test)
    restart: unless-stopped

volumes:
  fee-db:
